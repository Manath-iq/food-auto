name: Deploy to Cloudflare
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: food-auto-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "1c69f973b0d62a313dee95603b7e1b77"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx cf d1 migrations apply 9322e9a8-12ae-482c-8548-04ed519062a3 --dir migrations
      - run: npm run deploy
