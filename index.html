<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#191d1c" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <meta
      name="description"
      content="Своя кухня — рецепты, план питания и покупки в одном месте."
    />
    <title>Своя кухня — готовить с удовольствием</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      (() => {
        const tg = window.Telegram?.WebApp;
        const native =
          tg?.initData || (tg?.platform && tg.platform !== "unknown");
        document.documentElement.dataset.theme =
          native && (tg.colorScheme === "light" || tg.colorScheme === "dark")
            ? tg.colorScheme
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
